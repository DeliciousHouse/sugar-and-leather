name: Deploy to production

# Production is served by the Caddy Docker container on the VM at sugarandleather.com.
# A push to `main` does NOT update the live site on its own — this workflow is what
# reconnects "merge to main" to an actual deploy: it SSHes into the VM, syncs the repo
# to the merged commit, and rebuilds/restarts the container via deploy/deploy.sh.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         hostname or IP of the VM
#   DEPLOY_USER         SSH user (must be able to run docker — e.g. in the `docker` group)
#   DEPLOY_SSH_KEY      private SSH key authorized on the VM for DEPLOY_USER
#   DEPLOY_PATH         absolute path to the repo checkout on the VM (e.g. /srv/sugar-and-leather)
#   DEPLOY_KNOWN_HOSTS  VM's SSH host key(s), so SSH can verify the server and prevent MITM
#                       (get it with `ssh-keyscan -H <host>`; see deploy/README.md)
# Optional:
#   DEPLOY_PORT         SSH port (defaults to 22)
# Optional repository variable:
#   HEALTHCHECK_URL     URL to verify after deploy (defaults to https://sugarandleather.com/)
#
# See deploy/README.md for one-time VM setup.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two production deploys run at once; let an in-flight deploy finish.
concurrency:
  group: production-deploy
  cancel-in-progress: false

# This workflow deploys over SSH and never calls the GitHub API. It needs `contents: read`
# only to check out the repo so it can reproduce the build and verify what production is
# actually serving. Least privilege limits blast radius since the job also handles an SSH
# deploy key.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets are configured
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=()
          [ -z "$DEPLOY_HOST" ]        && missing+=(DEPLOY_HOST)
          [ -z "$DEPLOY_USER" ]        && missing+=(DEPLOY_USER)
          [ -z "$DEPLOY_SSH_KEY" ]     && missing+=(DEPLOY_SSH_KEY)
          [ -z "$DEPLOY_PATH" ]        && missing+=(DEPLOY_PATH)
          [ -z "$DEPLOY_KNOWN_HOSTS" ] && missing+=(DEPLOY_KNOWN_HOSTS)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}. See deploy/README.md for setup."
            exit 1
          fi

      # Build the same commit the VM is about to deploy, purely to learn the content-hashed
      # bundle filename Vite produces (e.g. assets/index-C4tm3MiX.js). Vite's hashes are
      # derived from content, so this filename fingerprints the commit's frontend. It is a
      # secondary signal only: it cannot detect a change that leaves the bundle identical,
      # which is why the verify step gates on dist/build.json instead.
      - name: Check out the commit being deployed
        uses: actions/checkout@v4
        with:
          # Full history: the verify step runs `git merge-base --is-ancestor` to tell a
          # superseded run (production on a NEWER commit, which is fine) apart from a
          # failed deploy (production on an unrelated or older commit). The default
          # depth-1 checkout has no ancestry to test.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build the expected artifact
        id: expected
        run: |
          set -euo pipefail
          npm ci
          npm run build
          bundle="$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)"
          if [ -z "$bundle" ]; then
            echo "::error::Could not determine the bundle filename from dist/index.html."
            exit 1
          fi
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "Expecting production to serve: $bundle"

      - name: Deploy over SSH
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # DEPLOY_KNOWN_HOSTS is required (verified in preflight) so every run
          # verifies the VM's host key. We deliberately do NOT fall back to
          # ssh-keyscan: runners are ephemeral, so a keyscan would re-trust the
          # host blindly on every deploy — no MITM protection at all.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # IMPORTANT: the command string below is NOT what runs on the VM.
          #
          # The deploy key is restricted in the VM's authorized_keys with
          #   restrict,command="/home/node/bin/sl-deploy-forced.sh"
          # so sshd runs that script and puts our command in SSH_ORIGINAL_COMMAND, which
          # the script deliberately ignores (the deploy user is in the docker group, which
          # is root-equivalent on a VM running ~20 production containers, so the key must
          # not be able to run arbitrary commands). The forced script does the fetch /
          # checkout / reset itself and ends in `exec bash deploy/deploy.sh`.
          #
          # Two consequences, both of which have already cost a red build:
          #   1. Editing this string changes nothing about what production runs. Deploy
          #      behaviour lives in deploy/deploy.sh and in the forced script on the VM.
          #   2. Nothing can be appended here to collect output. `exec` replaces the
          #      shell, so there is no "and then echo the SHA" to be had. The verify step
          #      below therefore works out what got deployed from git, not from the VM.
          #
          # `sl-deploy-selftest` is the one accepted argument: it proves the key and the
          # forced command work without triggering a deploy.
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -p "$port" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail; cd '$DEPLOY_PATH'; git fetch --prune origin; git checkout main; git reset --hard origin/main; bash deploy/deploy.sh"

      # A bare "is it 200?" check cannot fail. A stale site returns 200, and because the
      # container serves an SPA with a catch-all fallback, so does a MISSING file. That is
      # why the 2026-07-23 no-op deploy went unnoticed for three weeks. These checks assert
      # production is serving *this commit*, not merely that something is answering.
      - name: Verify production is serving this commit
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
          EXPECTED_BUNDLE: ${{ steps.expected.outputs.bundle }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="${HEALTHCHECK_URL:-https://sugarandleather.com/}"
          base="${url%/}"

          # The bundle name only fingerprints the JS. Vite hashes by content, so a commit
          # that touches nothing but static payload (public/assets images, robots/llms
          # text, favicons, fonts) rebuilds to the SAME bundle name production is already
          # serving, and comparing the two passes on attempt 1 without proving the deploy
          # ran. That is the hole #22 fell through when it removed 1.5MB of unused logos.
          #
          # dist/build.json carries the commit SHA, which changes on every commit by
          # construction, so it is the real gate and runs first.
          #
          # It may legitimately report a NEWER commit than this run: the VM resets to
          # origin/main, so a run queued behind another push deploys the newer commit.
          # That is a healthy deploy of a newer commit, not a failed deploy of this one,
          # so accept any descendant of GITHUB_SHA and label the run superseded.
          echo "Waiting for $base/build.json to report $GITHUB_SHA (or a descendant) ..."
          reported=""
          superseded=no
          accepted=no
          for attempt in 1 2 3 4 5 6; do
            # Content type first: when build.json is missing the SPA fallback answers 200
            # with the HTML shell, and jq would read that as an empty commit rather than
            # an error. Same trap robots.txt guards against below.
            ctype="$(curl -sS -o /tmp/build.json -w '%{content_type}' --max-time 20 "$base/build.json" || true)"
            case "$ctype" in
              application/json*) reported="$(jq -r '.commit // empty' /tmp/build.json 2>/dev/null || true)" ;;
              *) reported="" ;;
            esac
            echo "Attempt $attempt: build.json reports '${reported:-<none>}' (content-type ${ctype:-<none>})"

            if [ "$reported" = "$GITHUB_SHA" ]; then
              accepted=yes
              break
            fi

            # Fetch so a commit pushed after this run started is resolvable locally.
            # checkout uses fetch-depth: 0, so the ancestry needed here is present.
            if [ -n "$reported" ] && [ "$reported" != "unknown" ]; then
              git fetch -q origin main 2>/dev/null || true
              if git merge-base --is-ancestor "$GITHUB_SHA" "$reported" 2>/dev/null; then
                accepted=yes
                superseded=yes
                break
              fi
            fi
            sleep 10
          done

          if [ "$accepted" != "yes" ]; then
            echo "::error::Production reports commit '${reported:-<nothing>}', which is not"
            echo "::error::$GITHUB_SHA nor a descendant of it. The new build did not reach the"
            echo "::error::served container."
            echo "::error::'unknown' means deploy/deploy.sh did not stamp .build-commit."
            echo "::error::'<nothing>' with content-type text/html means build.json is not being"
            echo "::error::served: the live image predates this check, so redeploy from the VM once."
            exit 1
          fi

          if [ "$superseded" = "yes" ]; then
            echo "::notice::This run was superseded. It targeted $GITHUB_SHA but main had moved,"
            echo "::notice::so the VM deployed $reported. Production is live and verified on that"
            echo "::notice::newer commit, and its own run will confirm it again."
          else
            echo "Commit matches: $GITHUB_SHA"
          fi

          # EXPECTED_BUNDLE was built from THIS run's commit, so it only describes what is
          # installed when the run was not superseded. Checking it otherwise would report
          # a broken deploy for a build nobody installed.
          if [ "$superseded" = "yes" ]; then
            echo "Skipping the bundle-name check: the expected bundle is for an uninstalled build."
          else
            echo "Waiting for $url to serve $EXPECTED_BUNDLE ..."
            served=""
            for attempt in 1 2 3 4 5 6; do
              body="$(curl -sS --max-time 20 "$url" || true)"
              served="$(printf '%s' "$body" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 || true)"
              echo "Attempt $attempt: serving '${served:-<none>}'"
              [ "$served" = "$EXPECTED_BUNDLE" ] && break
              sleep 10
            done

            if [ "$served" != "$EXPECTED_BUNDLE" ]; then
              echo "::error::Production is serving '${served:-<nothing>}' but this commit builds"
              echo "::error::'$EXPECTED_BUNDLE'. The deploy did not take effect - the container is"
              echo "::error::probably still running the previous image. See deploy/README.md."
              exit 1
            fi
            echo "Bundle matches."
          fi

          # robots.txt is the canary for the SPA-fallback trap: if the file is missing the
          # server answers 200 with text/html instead of 404, so only the content type can
          # tell a real deploy from a broken one.
          ctype="$(curl -sS -o /dev/null -w '%{content_type}' --max-time 20 "$base/robots.txt" || true)"
          case "$ctype" in
            text/plain*) echo "robots.txt OK ($ctype)" ;;
            *) echo "::error::$base/robots.txt returned content-type '$ctype', expected text/plain."
               echo "::error::The file is missing and the SPA fallback is answering in its place."
               exit 1 ;;
          esac

          echo "Deploy verified."

name: Deploy to production

# Production is served by the Caddy Docker container on the VM at sugarandleather.com.
# A push to `main` does NOT update the live site on its own — this workflow is what
# reconnects "merge to main" to an actual deploy: it SSHes into the VM, syncs the repo
# to the merged commit, and rebuilds/restarts the container via deploy/deploy.sh.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         hostname or IP of the VM
#   DEPLOY_USER         SSH user (must be able to run docker — e.g. in the `docker` group)
#   DEPLOY_SSH_KEY      private SSH key authorized on the VM for DEPLOY_USER
#   DEPLOY_PATH         absolute path to the repo checkout on the VM (e.g. /srv/sugar-and-leather)
#   DEPLOY_KNOWN_HOSTS  VM's SSH host key(s), so SSH can verify the server and prevent MITM
#                       (get it with `ssh-keyscan -H <host>`; see deploy/README.md)
# Optional:
#   DEPLOY_PORT         SSH port (defaults to 22)
# Optional repository variable:
#   HEALTHCHECK_URL     URL to verify after deploy (defaults to https://sugarandleather.com/)
#
# See deploy/README.md for one-time VM setup.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two production deploys run at once; let an in-flight deploy finish.
concurrency:
  group: production-deploy
  cancel-in-progress: false

# This workflow deploys over SSH and never calls the GitHub API. It needs `contents: read`
# only to check out the repo so it can reproduce the build and verify what production is
# actually serving. Least privilege limits blast radius since the job also handles an SSH
# deploy key.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets are configured
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=()
          [ -z "$DEPLOY_HOST" ]        && missing+=(DEPLOY_HOST)
          [ -z "$DEPLOY_USER" ]        && missing+=(DEPLOY_USER)
          [ -z "$DEPLOY_SSH_KEY" ]     && missing+=(DEPLOY_SSH_KEY)
          [ -z "$DEPLOY_PATH" ]        && missing+=(DEPLOY_PATH)
          [ -z "$DEPLOY_KNOWN_HOSTS" ] && missing+=(DEPLOY_KNOWN_HOSTS)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}. See deploy/README.md for setup."
            exit 1
          fi

      # Build the same commit the VM is about to deploy, purely to learn the content-hashed
      # bundle filename Vite produces (e.g. assets/index-C4tm3MiX.js). Vite's hashes are
      # derived from content, so this filename is a fingerprint of the commit's frontend.
      # The post-deploy step asserts production is serving exactly this file — which is the
      # only way to distinguish "deployed" from "the old build is still up".
      - name: Check out the commit being deployed
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build the expected artifact
        id: expected
        run: |
          set -euo pipefail
          npm ci
          npm run build
          bundle="$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)"
          if [ -z "$bundle" ]; then
            echo "::error::Could not determine the bundle filename from dist/index.html."
            exit 1
          fi
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "Expecting production to serve: $bundle"

      - name: Deploy over SSH
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # DEPLOY_KNOWN_HOSTS is required (verified in preflight) so every run
          # verifies the VM's host key. We deliberately do NOT fall back to
          # ssh-keyscan: runners are ephemeral, so a keyscan would re-trust the
          # host blindly on every deploy — no MITM protection at all.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Sync the checkout to the just-merged commit, then run the deploy script
          # that lives in the repo. Path is single-quoted for the remote shell so
          # paths with spaces are handled safely.
          #
          # The trailing rev-parse reports which commit the VM actually put live. That is
          # NOT always github.sha: the VM resets to origin/main, so if another push landed
          # between this run starting and the SSH executing, the VM builds the newer
          # commit. The verify step asserts against what was deployed and reports the
          # difference separately, so a superseded run says "superseded" instead of
          # failing as if the deploy broke.
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -p "$port" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail; cd '$DEPLOY_PATH'; git fetch --prune origin; git checkout main; git reset --hard origin/main; bash deploy/deploy.sh; echo \"gha-deployed-sha=\$(git rev-parse HEAD)\"" \
              | tee /tmp/deploy.log

          deployed="$(grep -o 'gha-deployed-sha=[0-9a-f]\{40\}' /tmp/deploy.log | tail -1 | cut -d= -f2 || true)"
          if [ -z "$deployed" ]; then
            echo "::error::The deploy script did not report a deployed commit SHA."
            exit 1
          fi
          echo "deployed_sha=$deployed" >> "$GITHUB_OUTPUT"
          echo "VM deployed commit: $deployed"

      # A bare "is it 200?" check cannot fail. A stale site returns 200, and because the
      # container serves an SPA with a catch-all fallback, so does a MISSING file. That is
      # why the 2026-07-23 no-op deploy went unnoticed for three weeks. These checks assert
      # production is serving *this commit*, not merely that something is answering.
      - name: Verify production is serving this commit
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
          EXPECTED_BUNDLE: ${{ steps.expected.outputs.bundle }}
          DEPLOYED_SHA: ${{ steps.deploy.outputs.deployed_sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="${HEALTHCHECK_URL:-https://sugarandleather.com/}"
          base="${url%/}"

          # EXPECTED_BUNDLE was built from this run's commit. If the VM deployed a
          # different one (main moved while this run was queued), that bundle name
          # describes a build nobody installed, so comparing against it would report a
          # broken deploy when the deploy was fine. The build.json assertion below is
          # commit-exact and covers the superseded case correctly, so skip this one.
          superseded=no
          [ "$DEPLOYED_SHA" != "$GITHUB_SHA" ] && superseded=yes

          if [ "$superseded" = "yes" ]; then
            echo "Skipping the bundle-name check: this run targeted $GITHUB_SHA but the VM"
            echo "deployed $DEPLOYED_SHA, so the expected bundle name is for an uninstalled build."
          else
            echo "Waiting for $url to serve $EXPECTED_BUNDLE ..."
            served=""
            for attempt in 1 2 3 4 5 6; do
              body="$(curl -sS --max-time 20 "$url" || true)"
              served="$(printf '%s' "$body" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 || true)"
              echo "Attempt $attempt: serving '${served:-<none>}'"
              [ "$served" = "$EXPECTED_BUNDLE" ] && break
              sleep 10
            done

            if [ "$served" != "$EXPECTED_BUNDLE" ]; then
              echo "::error::Production is serving '${served:-<nothing>}' but this commit builds"
              echo "::error::'$EXPECTED_BUNDLE'. The deploy did not take effect — the container is"
              echo "::error::probably still running the previous image. See deploy/README.md."
              exit 1
            fi
            echo "Bundle matches."
          fi

          # The bundle name only fingerprints the JS. Vite hashes by content, so a commit
          # that touches nothing but static payload (public/assets images, robots/llms
          # text, favicons, fonts) rebuilds to the SAME bundle name production is already
          # serving -- and the check above passes on attempt 1 without proving anything.
          # That is the hole #22 fell through when it removed 1.5MB of unused logos.
          #
          # dist/build.json carries the commit SHA, which changes on every commit by
          # construction, so this assertion covers code and asset changes alike.
          echo "Waiting for $base/build.json to report $DEPLOYED_SHA ..."
          reported=""
          for attempt in 1 2 3 4 5 6; do
            # Content type first: if build.json is missing, the SPA fallback answers 200
            # with the HTML shell, and jq would parse that as a null commit rather than
            # an error. Same trap robots.txt guards against below.
            ctype="$(curl -sS -o /tmp/build.json -w '%{content_type}' --max-time 20 "$base/build.json" || true)"
            case "$ctype" in
              application/json*) reported="$(jq -r '.commit // empty' /tmp/build.json 2>/dev/null || true)" ;;
              *) reported="" ;;
            esac
            echo "Attempt $attempt: build.json reports '${reported:-<none>}' (content-type ${ctype:-<none>})"
            [ "$reported" = "$DEPLOYED_SHA" ] && break
            sleep 10
          done

          if [ "$reported" != "$DEPLOYED_SHA" ]; then
            echo "::error::Production reports commit '${reported:-<nothing>}' but the VM deployed"
            echo "::error::'$DEPLOYED_SHA'. The new build did not reach the served container."
            echo "::error::If the value is 'unknown', deploy/deploy.sh did not stamp .build-commit."
            echo "::error::If build.json 404s (content-type text/html), the deployed image predates"
            echo "::error::this check -- redeploy once from the VM to install it."
            exit 1
          fi
          echo "Commit matches: $DEPLOYED_SHA"

          if [ "$superseded" = "yes" ]; then
            echo "::notice::This run was superseded. It targeted $GITHUB_SHA but main had moved,"
            echo "::notice::so the VM deployed $DEPLOYED_SHA. Production is live and verified on the"
            echo "::notice::newer commit; the run for that commit will confirm it again."
          fi

          # robots.txt is the canary for the SPA-fallback trap: if the file is missing the
          # server answers 200 with text/html instead of 404, so only the content type can
          # tell a real deploy from a broken one.
          ctype="$(curl -sS -o /dev/null -w '%{content_type}' --max-time 20 "$base/robots.txt" || true)"
          case "$ctype" in
            text/plain*) echo "robots.txt OK ($ctype)" ;;
            *) echo "::error::$base/robots.txt returned content-type '$ctype', expected text/plain."
               echo "::error::The file is missing and the SPA fallback is answering in its place."
               exit 1 ;;
          esac

          echo "Deploy verified."
